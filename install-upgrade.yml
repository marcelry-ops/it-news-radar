name: IT News Radar - Upgrade installieren

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: it-news-radar-upgrade
  cancel-in-progress: false

jobs:
  install-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dateien pruefen
        run: |
          test -f apply_upgrade.py
          test -f radar_quality.py
          test -f update_news.py
          test -f update_cves.py
          test -d tests || { echo 'Fehler: tests/ aus dem Upgrade-ZIP fehlt.'; exit 1; }

      - name: Upgrade anwenden
        run: python apply_upgrade.py .

      - name: Python-Syntax pruefen
        run: python -m py_compile update_news.py update_cves.py radar_quality.py

      - name: Unit-Tests ausfuehren
        run: python -m unittest discover -s tests -v

      - name: Aenderungen pruefen
        run: |
          git diff --check
          git diff --stat
          git diff -- update_news.py update_cves.py

      - name: Gepruefte Aenderungen committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_news.py update_cves.py radar_quality.py
          if git diff --cached --quiet; then
            echo 'Keine Aenderungen vorhanden.'
          else
            git commit -m 'Improve IT news and CVE search quality'
            git push origin HEAD:main
          fi
