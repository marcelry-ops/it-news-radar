name: CVE-Daten aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
permissions:
  contents: write
concurrency:
  group: cve-data-update
  cancel-in-progress: false
jobs:
  update-cves:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CVE-Daten aus NVD und CISA KEV laden
        run: python update_cves.py
      - name: CVE-Daten veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cves.json
          if ! git diff --cached --quiet; then
            git commit -m 'CVE-Daten aktualisieren'
            git push
          fi
