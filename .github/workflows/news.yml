name: IT News aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: News aktualisieren
        run: python update_news.py

      - name: News-Dateien pruefen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('news.json', 'news_diagnostics.json'):
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f'Fehlende Datei: {filename}')
              with path.open(encoding='utf-8') as file:
                  data = json.load(file)
              if not isinstance(data, dict):
                  raise SystemExit(f'Ungueltiges JSON-Format: {filename}')
              print(f'{filename}: OK')
          PY

      - name: Aktualisierte News speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json news_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatische News-Aktualisierung"
            git push
          else
            echo "Keine Aenderungen vorhanden."
          fi
